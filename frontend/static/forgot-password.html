<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Восстановление пароля — GameMarket</title>
  <link rel="stylesheet" href="/static/styles.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
<div class="auth-page"><div class="auth-container"><div class="auth-card">
  <div class="auth-header">
    <a href="/" class="logo"><span class="logo-icon">🎮</span><span class="logo-text">Game<span class="logo-highlight">Market</span></span></a>
    <p class="auth-subtitle">Восстановление пароля</p>
  </div>

  <div id="resetConfigNotice" class="notice" style="margin-bottom:16px">Выберите, куда получить одноразовый код.</div>

  <form id="resetRequestForm" class="auth-form">
    <div class="form-group">
      <label>Способ восстановления</label>
      <select id="resetChannel">
        <option value="email">📧 Email</option>
        <option value="phone">📱 SMS на телефон</option>
      </select>
    </div>
    <div class="form-group">
      <label id="resetIdentifierLabel">Email</label>
      <input id="resetIdentifier" autocomplete="email" placeholder="name@example.com" required>
    </div>
    <button class="btn-auth" id="resetRequestButton">Получить код</button>
  </form>

  <form id="resetConfirmForm" class="auth-form" style="margin-top:18px">
    <div class="form-group">
      <label>Код подтверждения</label>
      <input id="resetCode" inputmode="numeric" maxlength="6" placeholder="000000" autocomplete="one-time-code" required>
    </div>
    <div class="form-group">
      <label>Новый пароль</label>
      <input type="password" id="resetNewPassword" minlength="8" autocomplete="new-password" required>
    </div>
    <button class="btn-auth">Установить новый пароль</button>
    <div id="resetDevCode" class="dev-code-note"></div>
    <p class="auth-link"><a href="/login">← Вернуться ко входу</a></p>
  </form>
</div></div></div>
<script src="/static/auth.js"></script>
</body></html>
