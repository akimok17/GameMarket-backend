<!DOCTYPE html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Регистрация — GameMarket</title><link rel="stylesheet" href="/static/styles.css"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"></head><body><div class="auth-page"><div class="auth-container"><div class="auth-card"><div class="auth-header"><a href="/" class="logo"><span class="logo-icon">🎮</span><span class="logo-text">Game<span class="logo-highlight">Market</span></span></a><p class="auth-subtitle">Создайте аккаунт</p></div><form id="registerForm" class="auth-form"><div class="form-group"><label>Логин</label><input id="regUsername" required minlength="3" pattern="[A-Za-z0-9_.-]+"></div><div class="form-group"><label>Email</label><input type="email" id="regEmail" required></div><div class="form-group"><label>Пароль</label><input type="password" id="regPassword" required minlength="8"><small style="color:#6f7895">Минимум 8 символов, буквы и цифры.</small></div><div class="form-group"><label>Имя</label><input id="regFullName"></div><div class="form-group"><label>Телефон</label><input id="regPhone" placeholder="Можно добавить позже"></div><button class="btn-auth">Зарегистрироваться</button><p class="auth-link">После входа подтверди email или телефон в профиле.</p><p class="auth-link">Есть аккаунт? <a href="/login">Войти</a></p></form></div></div></div><script src="/static/auth.js"></script></body></html>
